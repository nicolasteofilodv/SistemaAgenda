services:
  mysql:
    image: mysql:8.4.9
    container_name: autoagenda_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: autoagenda_dev 
      MYSQL_USER: autoagenda 
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_db:/var/lib/mysql

volumes:
  mysql_db:
