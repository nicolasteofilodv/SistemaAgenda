<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
	<head>
		<title>Registro</title>
	</head>
	<body>
		<h1>Cadastro de usuario</h1>
		
		<form th:action="@{/register}" th:object="${form}" method="post">
			<div>
				<input type="text" th:field="*{username}" placeholder="Email"/>
				<output th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></output>
            
			</div>
			<div>
				<input type="password" th:field="*{password}" placeholder="Senha"/>
			
				<output th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></output>
			</div>
            <div>
				<input type="text" th:field="*{name}" placeholder="Nome"/>
			
				<output th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></output>
			</div>
			</div>
			<div>
				<input type="text" th:field="*{lastName}" placeholder="Sobrenome"/>
			
				<output th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></output>
			</div>
			</div>
			<input type="submit" value="cadastrar-se" />
		</form>
	</body>
</html>
